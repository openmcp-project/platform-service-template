version: 3

vars:
  NESTED_MODULES: api
  API_DIRS: "{{.ROOT_DIR}}/api/v1alpha1/..."
  MANIFEST_OUT: "{{.ROOT_DIR}}/api/crds/manifests"
  CODE_DIRS: "{{.ROOT_DIR}}/cmd/... {{.ROOT_DIR}}/internal/... {{.ROOT_DIR}}/api/v1alpha1/..."
  COMPONENTS: "platform-service-template"
  REPO_URL: "https://github.com/openmcp-project/platform-service-template"
  COMMON_SCRIPT_DIR: "{{.ROOT_DIR}}/hack/common"

includes:
  shared:
    taskfile: hack/common/Taskfile_controller.yaml
    flatten: true

tasks:
  build:img:build-test:
    desc: "Build image for current platform and tag without suffix for testing"
    cmds:
      - task: build:img:build
      - docker tag ghcr.io/openmcp-project/images/{{.COMPONENTS}}:{{.VERSION}}-linux-{{ARCH}} ghcr.io/openmcp-project/images/{{.COMPONENTS}}:{{.VERSION}}
    vars:
      VERSION:
        sh: $COMMON_SCRIPT_DIR/get-version.sh
      ARCH:
        sh: uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/'

  test-e2e:
    desc: "Build image and run e2e tests"
    cmds:
      - task: build:img:build-test
      - go test -v ./test/e2e/... -count=1

  generate-service:
    desc: "Generate Platform Service with ocp-gen transformation"
    vars:
      debug: '{{.debug | default "false"}}'
      dryrun: '{{.dryrun | default "true"}}'
      kind: '{{.kind | default "MyKind"}}'
      name: '{{.name | default "myservice"}}'
      module: '{{.module | default "github.com/openmcp-project/platform-service-myservice"}}'
    env:
      DEBUG: "{{ .debug }}"
      KIND: "{{ .kind }}"
      KIND_LOWER: "{{ lower .kind }}"
      SERVICE_NAME: "{{ .name }}"
      SERVICE_NAME_LOWER: "{{ lower .name }}"
      MODULE: "{{ .module }}"
    cmds:
      - DRY_RUN={{.dryrun}} go generate ./...
      - cmd: mv ./cmd/platform-service-template ./cmd/platform-service-{{.name}}
        if: '{{eq .dryrun "false"}}'
      - cmd: go mod edit -module {{.module}}
        if: '{{eq .dryrun "false"}}'
